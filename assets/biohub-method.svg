<title id="title">From temporal features to cell lineages</title><desc id="desc">Temporal 3D features: 3D U-Net + node Transformer DeepCenter localization → Cell-to-cell scores: Bidirectional / harmonic links Continuation + division → Lineage graph: ILP + graph repair Optional motion refinement. Core question: do better association scores produce better complete tracking graphs?</desc>
